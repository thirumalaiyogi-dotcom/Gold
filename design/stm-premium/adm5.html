<style id="adm5css">
/* ===== STM Admin · design foundation (shares the Style 5 tokens) ===== */
.adm5{--a-maroon:#6E1423;--a-burg:#4A0D18;--a-gold:#C9A45C;--a-gold-soft:#E5C98B;--a-gold-50:#F6EEDC;--a-ivory:#FBF8F1;--a-line:#EADFC8;--a-line-2:#F1E9D8;--a-ink:#252525;--a-mut:#777;--a-ok:#24865B;--a-ok-50:#E7F3EC;--a-err:#C63C45;--a-err-50:#FBEAEA;--a-r:14px;--a-sh:0 1px 2px rgba(74,13,24,.05),0 4px 14px rgba(74,13,24,.05);
 background:var(--a-ivory)!important;border:1px solid var(--a-line)!important;border-radius:18px!important;box-shadow:var(--a-sh)!important;color:var(--a-ink);font-family:"Noto Sans Tamil","Noto Sans",system-ui,sans-serif}
.adm5 *{box-sizing:border-box}
.adm5 .a5h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.adm5 .a5h h2{margin:0!important;font-size:18px!important;color:var(--a-ink)!important}
.adm5 .a5h small{color:var(--a-mut);font-size:12px}
.adm5 .a5r{all:unset;cursor:pointer;color:var(--a-maroon);font-size:13px;font-weight:600;padding:8px 0 8px 10px}
.adm5 .a5hero{border-radius:var(--a-r);padding:16px;background:linear-gradient(160deg,var(--a-maroon),var(--a-burg));color:#fff;margin-bottom:12px;position:relative;overflow:hidden}
.adm5 .a5hero:before{content:"";position:absolute;inset:5px;border:1px solid rgba(229,201,139,.28);border-radius:11px;pointer-events:none}
.adm5 .a5hero small{color:var(--a-gold-soft);font-size:12px}
.adm5 .a5hero b{display:block;font:700 28px/1.15 "Noto Serif Tamil",Georgia,serif;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.adm5 .a5hero .a5hs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(229,201,139,.25)}
.adm5 .a5hero .a5hs b{font-size:18px;margin:2px 0 0}
.adm5 .a5g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:720px){.adm5 .a5g{grid-template-columns:repeat(4,minmax(0,1fr))}}
.adm5 .a5k{background:#fff;border:1px solid var(--a-line);border-radius:12px;padding:12px;min-width:0}
.adm5 .a5k small{display:block;font-size:12px;color:var(--a-mut);line-height:1.35}
.adm5 .a5k b{display:block;margin-top:4px;font:700 22px/1.15 "Noto Serif Tamil",Georgia,serif;color:var(--a-ink);font-variant-numeric:tabular-nums}
.adm5 .a5k em{font-style:normal;font-size:11.5px;color:var(--a-mut)}
.adm5 .a5k.warn b{color:var(--a-err)}
.adm5 .a5k.ok b{color:var(--a-ok)}
.adm5 .a5l{margin-top:12px;background:#fff;border:1px solid var(--a-line);border-radius:12px;padding:4px 12px}
.adm5 .a5l h3{margin:10px 0 6px;font-size:14px;color:var(--a-ink)}
.adm5 .a5t{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--a-line-2);font-size:13.5px}
.adm5 .a5t span{min-width:0;overflow-wrap:anywhere}
.adm5 .a5t small{display:block;color:var(--a-mut);font-size:12px}
.adm5 .a5t b{white-space:nowrap;font-variant-numeric:tabular-nums}
.adm5 .a5e{padding:12px 0;border-top:1px solid var(--a-line-2);color:var(--a-mut);font-size:13px}
.adm5 .a5n{margin:10px 2px 0;font-size:11.5px;color:var(--a-mut);line-height:1.5}
</style>
<script>
/* ===== STM Admin Dashboard (foundation) =====
   Uses only data the staff panel already loads under staff RLS: window.CU (customers + payments),
   EXTRA (schemes), and one count query on gold_requests. No writes, no hardcoded numbers. */
(function(){
 const grp=document.getElementById("g_today");if(!grp||document.getElementById("adm5"))return;
 const card=document.createElement("div");card.className="card adm5";card.id="adm5";card.setAttribute("aria-live","polite");
 grp.prepend(card);
 const R=n=>Math.round(+n||0).toLocaleString("en-IN");
 const E=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const ist=()=>new Date(Date.now()+330*60000).toISOString();
 const T=(fn,d)=>{try{return fn()}catch(e){return d}};
 let PEND=null,sig="";
 async function pend(){const r=await T(()=>sb.from("gold_requests").select("id",{count:"exact",head:true}).eq("status","pending"),null);if(r&&!r.error)PEND=r.count;render(true)}
 function render(force){
  const C=window.CU;if(!Array.isArray(C)){card.innerHTML='<div class="a5h"><h2>📊 Dashboard</h2></div><p class="a5e">தகவல் ஏற்றுகிறது…</p>';return}
  const day=ist().slice(0,10),mon=day.slice(0,7);
  const s=[C.length,C.reduce((a,c)=>a+(c.gold_payments||[]).length,0),PEND,day].join("|");if(!force&&s===sig)return;sig=s;
  const mo=k=>T(()=>MON(k),12),silv=k=>T(()=>SILV(k),false);
  let tot=0,today=0,month=0,todayN=0,monthN=0,done=0,due=0,newM=0,noPin=0;const all=[];
  C.forEach(c=>{const P=c.gold_payments||[],m=mo(c.scheme),fl=silv(c.scheme);
   const mset=new Set(P.map(x=>String(x.paid_on).slice(0,7))),cnt=fl?mset.size:P.length;
   if(cnt>=m&&!(fl&&mset.has(mon)))done++;else if(!mset.has(mon))due++;
   if(String(c.start_date||"").slice(0,7)===mon)newM++;
   if(c.pin_set===false)noPin++;
   P.forEach(x=>{const a=+x.amount||0,d=String(x.paid_on||"");tot+=a;if(d.slice(0,10)===day){today+=a;todayN++}if(d.slice(0,7)===mon){month+=a;monthN++}all.push({c,x})})});
  const active=C.length-done;
  const sch=2+T(()=>EXTRA.filter(e=>e.active!==false).length,0);
  all.sort((a,b)=>String(b.x.paid_on).localeCompare(String(a.x.paid_on)));
  const rec=all.slice(0,5);
  const k=(l,v,cls,sub)=>`<div class="a5k${cls?" "+cls:""}"><small>${l}</small><b>${v}</b>${sub?`<em>${sub}</em>`:""}</div>`;
  card.innerHTML=`<div class="a5h"><div><h2>📊 Dashboard</h2><small>${new Date(day+"T00:00:00").toLocaleDateString("ta-IN",{day:"numeric",month:"long",year:"numeric"})}</small></div><button type="button" class="a5r" data-a5r>புதுப்பி ↻</button></div>
   <div class="a5hero"><small>இன்றைய வசூல்</small><b>₹${R(today)}</b><small>${todayN} பதிவு</small>
    <div class="a5hs"><div><small>இந்த மாத வசூல்</small><b>₹${R(month)}</b></div><div><small>மொத்த வசூல்</small><b>₹${R(tot)}</b></div></div></div>
   <div class="a5g">
    ${k("மொத்த customers",R(C.length))}
    ${k("Active customers",R(active),"ok",done?done+" பேர் திட்டம் முடிச்சாங்க":"")}
    ${k("இந்த மாசம் சேர்ந்தவங்க",R(newM))}
    ${k("புதிய கோரிக்கைகள்",PEND==null?"—":R(PEND),PEND?"warn":"","approve பண்ண")}
    ${k("இந்த மாசம் கட்ட வேண்டியவங்க",R(due),due?"warn":"")}
    ${k("இந்த மாத பதிவுகள்",R(monthN))}
    ${k("mPIN அமைக்காதவங்க",R(noPin),noPin?"warn":"")}
    ${k("Active திட்டங்கள்",R(sch))}
   </div>
   <div class="a5l"><h3>சமீபத்திய பரிவர்த்தனைகள்</h3>${rec.length?rec.map(({c,x})=>`<div class="a5t"><span>${E(c.name)}<small>${E(T(()=>SN[c.scheme],c.scheme))} · ${E(String(x.paid_on).slice(0,10))}${x.mode?" · "+E(T(()=>MDN[x.mode],x.mode)):""}</small></span><b>₹${R(x.amount)}</b></div>`).join(""):'<p class="a5e">இன்னும் பதிவு எதுவும் இல்லை.</p>'}</div>
   <p class="a5n">எல்லா எண்ணிக்கையும் database-ல உள்ள உண்மையான பதிவுகளில் இருந்து கணக்கிடப்படுது. Online payment வெற்றி / தோல்வி எண்ணிக்கைக்கு database அனுமதி (RLS) மாற்றம் தேவை, அது owner ஒப்புதலுக்குப் பிறகு.</p>`;
 }
 card.addEventListener("click",e=>{if(e.target.closest("[data-a5r]")){T(()=>load(),0);pend()}});
 render(true);pend();setInterval(()=>render(false),1500);
})();
</script>
