# Builds the Android customer app (Trusted Web Activity) in the cloud.
#   Output (download from the run page → "Artifacts"):
#     • stm-gold-release-aab  → app-release.aab  (upload this to Google Play)
#     • stm-gold-debug-apk    → app-debug.apk    (install directly on a phone to test)
#   Signing key comes ONLY from GitHub Secrets:
#     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android app build

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write   # only used to publish the UNSIGNED bundle to the "android-build" branch when no key is set

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Check Gradle wrapper is genuine
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare upload key from Secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret இல்லை. Debug APK மட்டும் (debug key) உருவாகும்; Play-க்கு AAB உருவாகாது. README-ல் படி 2 பாருங்க."
            echo "HAS_KEY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$KS_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "HAS_KEY=true" >> "$GITHUB_ENV"

      - name: Build signed AAB + APK
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace bundleRelease assembleDebug

      - name: Build debug APK + UNSIGNED AAB (no key in Secrets)
        if: env.HAS_KEY != 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug bundleRelease

      - name: Publish UNSIGNED AAB to branch android-build (signed later with the offline upload key)
        if: env.HAS_KEY != 'true'
        run: |
          set -e
          OUT="$RUNNER_TEMP/build-out"; mkdir -p "$OUT"
          cp app/build/outputs/bundle/release/app-release.aab "$OUT/app-release-unsigned.aab"
          cd "$OUT"
          VC=$(grep -m1 "versionCode" "$GITHUB_WORKSPACE/android/app/build.gradle" | tr -dc '0-9')
          printf 'commit=%s\nversionCode=%s\nbuilt=%s\n' "$GITHUB_SHA" "$VC" "$(date -u +%FT%TZ)" > BUILD_INFO.txt
          git init -q -b android-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Unsigned AAB from $GITHUB_SHA (versionCode $VC)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-build

      - name: Upload-key SHA-256 (public value → goes into assetlinks.json)
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          FP=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          {
            echo "### Upload key SHA-256"
            echo '```'
            echo "$FP"
            echo '```'
            echo "இதை \`.well-known/assetlinks.json\`-ல் \`UPLOAD_KEY_SHA256_REPLACE_ME\` இடத்தில் போடுங்க."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save AAB
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stm-gold-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Save debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stm-gold-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove key file from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
