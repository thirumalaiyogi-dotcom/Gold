# ONE-TIME: creates the Play "upload key" (keystore) in the cloud.
# Before running, add these 3 Secrets yourself (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_PASSWORD  – a long password you choose (write it down offline)
#   ANDROID_KEY_PASSWORD       – the SAME password (PKCS12 keystores use one password)
#   ANDROID_KEY_ALIAS          – e.g. upload
# The keystore is given ONLY as a downloadable artifact that is deleted after 1 day.
# Nothing is committed to the repository and no password is printed.
name: One-time - create upload keystore

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "புதிய upload key உருவாக்க CREATE என்று type செய்யுங்க"
        required: true
        default: ""
      public_repo_ok:
        description: "Repo public-ஆக இருந்தாலும் தொடரவா? (yes / no)"
        required: true
        default: "no"

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Safety checks
        env:
          CONFIRM: ${{ inputs.confirm }}
          PUBLIC_OK: ${{ inputs.public_repo_ok }}
          IS_PRIVATE: ${{ github.event.repository.private }}
          EXISTING: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [ "$CONFIRM" = "CREATE" ] || { echo "::error::confirm பெட்டியில் CREATE என்று type செய்யுங்க."; exit 1; }
          if [ -n "$EXISTING" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 ஏற்கனவே இருக்கு. புது key செய்தா Play update-கள் பாதிக்கும். பழைய key தொலைந்திருந்தால் மட்டும், அந்த secret-ஐ நீக்கிவிட்டு, Play Console-ல் 'upload key reset' கோருங்க."
            exit 1
          fi
          [ -n "$SP" ] && [ -n "$KP" ] && [ -n "$ALIAS" ] || { echo "::error::ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS மூன்று secret-ம் முதலில் சேர்க்கணும்."; exit 1; }
          [ "$SP" = "$KP" ] || { echo "::error::ANDROID_KEY_PASSWORD-ம் ANDROID_KEYSTORE_PASSWORD-ம் ஒரே password-ஆக இருக்கணும்."; exit 1; }
          [ ${#SP} -ge 12 ] || { echo "::error::Password குறைந்தது 12 எழுத்து இருக்கணும்."; exit 1; }
          if [ "$IS_PRIVATE" != "true" ] && [ "$PUBLIC_OK" != "yes" ]; then
            echo "::error::இந்த repo PUBLIC. Artifact-ஐ GitHub login உள்ள யாரும் download செய்ய முடியும். Repo-வை சிறிது நேரம் Private ஆக்குங்க, அல்லது public_repo_ok = yes கொடுங்க (password வலுவாக இருந்தால் மட்டும்)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create keystore
        env:
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/out"
          keytool -genkeypair -storetype PKCS12 -keystore upload-keystore.jks \
            -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$SP" -keypass "$SP" \
            -dname "CN=Subbulakshmi Thanga Maligai, O=Subbulakshmi Thanga Maligai, L=Puliyangudi, ST=Tamil Nadu, C=IN" >/dev/null 2>&1
          base64 -w0 upload-keystore.jks > ANDROID_KEYSTORE_BASE64.txt
          FP=$(keytool -list -v -keystore upload-keystore.jks -alias "$ALIAS" -storepass "$SP" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          {
            echo "Upload key SHA-256 (public, safe to share):"
            echo "$FP"
            echo
            echo "1. ANDROID_KEYSTORE_BASE64.txt உள்ளே இருக்கும் முழு text-ஐ copy செய்து ANDROID_KEYSTORE_BASE64 என்ற secret-ஆக சேருங்க."
            echo "2. upload-keystore.jks-ஐ Google Drive (தனி folder) + pen drive / இன்னொரு phone-ல் பத்திரமாக வைங்க. Password-ஐ தனியாக எழுதி வைங்க."
            echo "3. GitHub-ல் இந்த run-இன் artifact-ஐ உடனே Delete செய்யுங்க."
          } > KEEP-SAFE-README.txt
          {
            echo "### Upload keystore உருவாகியது"
            echo "SHA-256: \`$FP\`"
            echo
            echo "கீழே **Artifacts → upload-keystore**-ஐ download செய்து, README படிகளைச் செய்து, பிறகு artifact-ஐ delete செய்யுங்க (1 நாளில் தானாகவும் நீங்கும்)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Give keystore as a 1-day artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/out"
