# Flutter WEB build of the native app — ONLY for design screenshots / review (not shipped anywhere).
# Fonts are bundled (no runtime Google Fonts fetch) and CanvasKit is local, so it renders offline.
# Output → branch native-web (static files).
name: Native web preview (design review)

on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - ".github/workflows/native-web-preview.yml"

permissions:
  contents: write

concurrency:
  group: native-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bundle Noto Tamil fonts (google_fonts uses asset files when present)
        run: |
          mkdir -p assets/google_fonts
          B=https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts
          for fam in NotoSansTamil NotoSerifTamil; do
            for w in Regular Medium SemiBold Bold; do
              curl -fsSL --retry 3 -o "assets/google_fonts/$fam-$w.ttf" "$B/$fam/hinted/ttf/$fam-$w.ttf"
            done
          done
          ls -la assets/google_fonts
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("pubspec.yaml"); s = p.read_text()
          s = s.replace("    - assets/\n", "    - assets/\n    - assets/google_fonts/\n", 1)
          p.write_text(s)
          PY
      - name: Build web
        id: build
        run: |
          set -o pipefail
          flutter create --org com.subbulakshmi --project-name stm_proto --platforms web .
          rm -rf test
          flutter pub get
          flutter build web --release --no-web-resources-cdn --base-href / 2>&1 | tee build-web.log
      - name: Publish to branch native-web
        if: always()
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          cp -r build/web/. "$OUT/" 2>/dev/null || true
          cp build-web.log "$OUT/" 2>/dev/null || true
          echo "commit=$GITHUB_SHA result=${{ steps.build.outcome }} built=$(date -u +%FT%TZ)" > "$OUT/BUILD_INFO.txt"
          cd "$OUT"
          git init -q -b native-web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "native web preview ${{ steps.build.outcome }} from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" native-web
