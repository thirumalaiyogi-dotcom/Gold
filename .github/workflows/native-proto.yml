# Native (Flutter) PROTOTYPE — sample data only, separate app id (com.subbulakshmi.stm_proto),
# so it installs next to the real app. Outputs are pushed to branches:
#   native-build      → stm-native-proto.apk + build-android.log
#   native-build-ios  → build-ios.log (iPhone build check, unsigned — needs an Apple account to install)
name: Native prototype (Flutter)

on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - ".github/workflows/native-proto.yml"

permissions:
  contents: write

concurrency:
  group: native-proto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Gradle downloads (survives GitHub download outages)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('native/pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Generate platform folders
        run: |
          flutter --version | tee flutter-version.txt
          flutter create --org com.subbulakshmi --project-name stm_proto --platforms android,ios .
          rm -rf test
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$M"
          sed -i 's/android:label="stm_proto"/android:label="STM Digi Gold (Test)"/' "$M"
          grep -n "INTERNET\|android:label" "$M"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET"/>#&\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="com.vivo.notification.permission.BADGE_ICON"/>\n    <uses-permission android:name="com.sec.android.provider.badge.permission.READ"/>\n    <uses-permission android:name="com.sec.android.provider.badge.permission.WRITE"/>\n    <uses-permission android:name="com.huawei.android.launcher.permission.CHANGE_BADGE"/>#' "$M"
          cp -r android_res/* android/app/src/main/res/
          cp android_extra/proguard-rules.pro android/app/proguard-rules.pro
          # local_auth (fingerprint) needs a FragmentActivity
          find android/app/src/main -name 'MainActivity.kt' -exec sed -i 's/FlutterActivity/FlutterFragmentActivity/g' {} +
          grep -rn "FlutterFragmentActivity" android/app/src/main/kotlin || true
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('<uses-permission android:name="android.permission.INTERNET"/>', '<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>', 1)
          rec = """        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
              </application>"""
          s = s.replace("</application>", rec, 1)
          p.write_text(s)
          PY
          grep -c "ScheduledNotification" android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
          s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          # keep rules for scheduled notifications (see android_extra/proguard-rules.pro)
          rel = 'signingConfig = signingConfigs.getByName("debug")'
          assert rel in s, "release block not found"
          s = s.replace(rel, rel + '\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")', 1)
          p.write_text(s)
          PY
          grep -n "Desugar\|desugar" android/app/build.gradle.kts
      - name: Build APK
        id: build
        run: |
          set -o pipefail
          {
            flutter pub get
            dart run flutter_launcher_icons
            # retry: GitHub-hosted Gradle download sometimes returns 504
            sed -i 's#https\\://github.com/gradle/gradle-distributions/releases/download/v\([0-9.]*\)/gradle-\([0-9.]*\)-all.zip#https\\://services.gradle.org/distributions/gradle-\2-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties || true
            grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties || true
            for t in 1 2 3; do flutter build apk --release && break; echo "build attempt $t failed, retrying"; sleep 30; done
          } 2>&1 | tee build-android.log
      - name: Publish APK + log to branch native-build
        if: always()
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          cp build-android.log flutter-version.txt "$OUT/" 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-release.apk "$OUT/stm-native-proto.apk" 2>/dev/null || true
          RES=${{ steps.build.outcome }}; [ -f "$OUT/stm-native-proto.apk" ] || RES=failure
          echo "commit=$GITHUB_SHA result=$RES built=$(date -u +%FT%TZ)" > "$OUT/BUILD_INFO.txt"
          cd "$OUT"
          git init -q -b native-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "native prototype build ${{ steps.build.outcome }} from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" native-build

  ios:
    runs-on: macos-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --org com.subbulakshmi --project-name stm_proto --platforms android,ios .
          rm -rf test
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName தங்க மாளிகை" ios/Runner/Info.plist || true
      - name: Build iOS (no code signing)
        id: build
        run: |
          set -o pipefail
          {
            flutter pub get
            dart run flutter_launcher_icons
            flutter build ios --release --no-codesign
          } 2>&1 | tee build-ios.log
      - name: Publish iOS log to branch native-build-ios
        if: always()
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          cp build-ios.log "$OUT/" 2>/dev/null || true
          echo "commit=$GITHUB_SHA result=${{ steps.build.outcome }} built=$(date -u +%FT%TZ)" > "$OUT/BUILD_INFO.txt"
          cd "$OUT"
          git init -q -b native-build-ios
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "iOS prototype build ${{ steps.build.outcome }} from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" native-build-ios
