name: stm_proto
description: "சுப்புலட்சுமி தங்க மாளிகை — native app prototype (Flutter, mock data only)"
publish_to: 'none'
version: 0.9.7+19

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  http: ^1.2.2
  flutter_cashfree_pg_sdk: ^2.2.8+46
  flutter_local_notifications: ^19.4.0
  workmanager: ^0.10.10
  shared_preferences: ^2.3.2
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.0
  app_badge_plus: ^1.2.4
  timezone: ^0.10.0
  share_plus: ^11.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFAF0"
  adaptive_icon_foreground: "assets/icon_fg.png"
  remove_alpha_ios: true
